experiment_id: revision_public
defaults:
  dataset_id: xinwu_public
  spatial_resolution: k100
  temporal_mode: repday_opt
  weights_csv: data/xinwu_public/temporal_weights.csv
  use_existing_weights: true
  n_rep_days: 8
  technology_set: base_with_storage_degradation
  grid_carbon_scenario: baseline
  objective: min_cost
  load_shedding_penalty_yuan_per_kwh: 100000.0
matrix:
  technology_set:
    - base_with_storage_degradation
    - base_with_DR10
    - base_with_thermal10
    - base_with_DR10_EV_medium_thermal10
  co2_cap_ratio:
    - 1.0
    - 0.4
    - 0.25
    - 0.15
    - 0.14
extra_runs:
  - technology_set: grid_only_reference
    objective: min_cost
    co2_cap_ratio: null
  - technology_set: base_with_storage_degradation
    objective: min_emissions
    co2_cap_ratio: null
  - technology_set: base_with_DR10_EV_medium_thermal10
    objective: min_emissions
    co2_cap_ratio: null
  - technology_set: base_with_storage_degradation
    co2_cap_ratio: 0.14
    network_mode: spatial_transfer_proxy
    allow_large_spatial_transfer_proxy: true
